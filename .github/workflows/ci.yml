name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publishers:
        description: 'load-test: simulated video publishers'
        default: '20'
      subscribers:
        description: 'load-test: simulated subscribers'
        default: '50'
      duration:
        description: 'load-test: duration (e.g. 60s)'
        default: '60s'

jobs:
  # Always runs — no secrets needed. Gates every push/PR.
  # NOTE: `vite build` is intentionally NOT run here. The build aborts on an
  # empty VITE_LIVEKIT_URL by design (it would strip the in-call UI and ship a
  # broken bundle), and that var lives only in Cloudflare's build settings —
  # Cloudflare CI owns the production build. `tsc -b` is the compile gate.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (pure logic — no LiveKit needed)
        run: npm run test:unit

  # E2E hits the real LiveKit Cloud backend, so it only runs when the repo has
  # the creds configured. Skips cleanly (not fails) when secrets are absent —
  # e.g. on fork PRs.
  e2e:
    runs-on: ubuntu-latest
    needs: typecheck
    # FROZEN (2026-06): LiveKit-backed E2E is disabled to preserve the monthly
    # quota. These specs connect to the real LiveKit Cloud test project and burn
    # participant-minutes on every run. Re-enable by setting repo variable
    # LIVEKIT_TESTS=true (Settings → Secrets and variables → Actions → Variables).
    if: ${{ vars.LIVEKIT_TESTS == 'true' && (github.event_name == 'push' || github.repository == 'B-ismark/Manim') }}
    env:
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if LiveKit creds are not configured
        id: guard
        run: |
          if [ -z "$LIVEKIT_API_KEY" ] || [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LiveKit secrets absent — skipping E2E."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - name: Install Playwright Chromium
        if: steps.guard.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Start app (vite + token server)
        if: steps.guard.outputs.run == 'true'
        run: npm run dev &
      - name: Wait for vite
        if: steps.guard.outputs.run == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "vite did not come up" && exit 1
      - name: Run E2E (functional + a11y) — desktop
        if: steps.guard.outputs.run == 'true'
        # Serial — concurrent WebRTC contexts saturate the runner and flake.
        run: npm test -- --workers=1
      - name: Run E2E (functional + a11y) — mobile
        if: steps.guard.outputs.run == 'true'
        # Touch layouts (bottom sheets, auto-hide chrome, portrait tiles).
        run: npm run test:mobile -- --workers=1
      - name: Run real-estate fit checks — small phone (iPhone SE size)
        if: steps.guard.outputs.run == 'true'
        run: npm run test:mobile-sm -- --workers=1
      - name: Run visual scenarios (screenshots + edge cases)
        if: steps.guard.outputs.run == 'true'
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload scenario screenshots
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        with:
          name: scenario-screenshots
          path: audit/scenarios/
          retention-days: 7

  # E2E against a LOCAL livekit-server, and deliberately NOT gated on
  # LIVEKIT_TESTS.
  #
  # The freeze protects the CLOUD project's participant-minutes. A server on
  # localhost cannot touch them — that is the same reasoning CLAUDE.md already
  # uses to allow the full suite locally, applied to CI. So this job runs on
  # every push and PR while the cloud-backed `e2e` job above stays frozen.
  #
  # Runs all three projects — desktop, mobile and mobile-sm. Anything less leaves
  # a project no one is running, which is the hole this job exists to close.
  #
  # Why it exists: with `e2e` gated off, CI ran typecheck, unit tests and
  # Lighthouse and never executed a single Playwright spec. Specs were being
  # added that nothing but a developer's memory would ever run again.
  e2e-local:
    runs-on: ubuntu-latest
    needs: typecheck
    # Three projects, ~11 minutes of wall clock locally and slower on a two-core
    # runner. GitHub's default is SIX HOURS, so a hung WebRTC test would hold a
    # runner for a working day before anyone noticed — and this job was added the
    # same evening the repo spent five hours with jobs stuck waiting on runners.
    # Bound it, with room for the two mobile projects that joined desktop here.
    timeout-minutes: 45
    env:
      # --dev starts livekit-server with this well-known pair. They are not
      # secrets: they are hardcoded in LiveKit's dev mode and only ever reach a
      # server bound to loopback on this runner.
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_URL: ws://127.0.0.1:7880
      VITE_LIVEKIT_URL: ws://127.0.0.1:7880
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 1.10+ is required: 1.9 and older 404 the /rtc/v1 route this client uses.
      - name: Start a local livekit-server
        run: |
          curl -fsSL -o lk.tar.gz \
            https://github.com/livekit/livekit/releases/download/v1.10.0/livekit_1.10.0_linux_amd64.tar.gz
          tar xzf lk.tar.gz livekit-server
          ./livekit-server --dev --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7880/ >/dev/null; then echo "livekit up"; exit 0; fi
            sleep 1
          done
          echo "::error::livekit-server did not come up" && exit 1

      - name: Start app (vite + token server)
        run: npm run dev &
      - name: Wait for vite
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "::error::vite did not come up" && exit 1

      # Serial: concurrent WebRTC contexts saturate a 2-core runner and flake.
      - name: Run E2E — desktop
        run: npm test -- --workers=1

      # Mobile runs here for exactly the reason desktop does. It used to live only
      # in the frozen cloud `e2e` job, so from the day that job was gated off until
      # this one was added, nothing ran a mobile spec at all — and main went red on
      # eight of them without anyone finding out (#18). Fail-fast is deliberate:
      # each project overwrites playwright-report/, so stopping at the first
      # failure is what keeps the uploaded report the failing one.
      - name: Run E2E — mobile
        run: npm run test:mobile -- --workers=1

      - name: Run E2E — mobile-sm
        run: npm run test:mobile-sm -- --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-local
          path: playwright-report/
          retention-days: 7

  # Lighthouse budgets on landing + prejoin (the routes that render without a live
  # room). Needs VITE_LIVEKIT_URL to build (the build aborts on empty), so it's
  # gated on that secret and skips cleanly when it's absent. Asserts the budgets
  # in lighthouserc.json — a perf/a11y/seo regression fails the build.
  lighthouse:
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if build var is not configured
        id: guard
        run: |
          if [ -z "$VITE_LIVEKIT_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VITE_LIVEKIT_URL absent — skipping Lighthouse."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - name: Build
        if: steps.guard.outputs.run == 'true'
        run: npm run build
      - name: Lighthouse CI
        if: steps.guard.outputs.run == 'true'
        run: npm run lighthouse

  # Scale stress — manual (workflow_dispatch). Floods a TEST room with lk
  # load-test sim participants (server-side, no browsers) while one Playwright
  # host observes the UI. Uploads the host screenshot + load-test stats. Uses the
  # same LiveKit secrets (point them at a TEST project, never prod).
  loadtest:
    # FROZEN (2026-06): see e2e note. Load-test floods a LiveKit room with sim
    # publishers/subscribers — the heaviest quota consumer. Re-enable via repo
    # variable LIVEKIT_TESTS=true.
    if: ${{ vars.LIVEKIT_TESTS == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
      ROOM: stress-${{ github.run_id }}
      PUBLISHERS: ${{ github.event.inputs.publishers }}
      SUBSCRIBERS: ${{ github.event.inputs.subscribers }}
      DURATION: ${{ github.event.inputs.duration }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard on creds
        id: guard
        run: |
          if [ -z "$LIVEKIT_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LiveKit secrets absent — cannot load-test."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with: { node-version: 20, cache: npm }
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - name: Install livekit-cli
        if: steps.guard.outputs.run == 'true'
        run: curl -sSL https://get.livekit.io/cli | bash
      - name: Install Playwright Chromium
        if: steps.guard.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Start app
        if: steps.guard.outputs.run == 'true'
        run: npm run dev &
      - name: Wait for vite
        if: steps.guard.outputs.run == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Flood the room (background)
        if: steps.guard.outputs.run == 'true'
        run: npm run loadtest &
      - name: Observe host UI under load
        if: steps.guard.outputs.run == 'true'
        env:
          LOADTEST_ROOM: ${{ env.ROOM }}
        run: |
          sleep 10   # let publishers ramp into the room first
          npx playwright test 10-loadtest-observe --project=desktop --workers=1
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        with:
          name: loadtest-results
          path: |
            audit/scenarios/
            audit/loadtest-*.txt
            playwright-report/
          retention-days: 14
