name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Always runs — no secrets needed. Gates every push/PR.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Build must not bake a token-server origin; runtime injects it.
          VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}

  # E2E hits the real LiveKit Cloud backend, so it only runs when the repo has
  # the creds configured. Skips cleanly (not fails) when secrets are absent —
  # e.g. on fork PRs.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || github.repository == 'B-ismark/Manim' }}
    env:
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if LiveKit creds are not configured
        id: guard
        run: |
          if [ -z "$LIVEKIT_API_KEY" ] || [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LiveKit secrets absent — skipping E2E."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - name: Install Playwright Chromium
        if: steps.guard.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Start app (vite + token server)
        if: steps.guard.outputs.run == 'true'
        run: npm run dev &
      - name: Wait for vite
        if: steps.guard.outputs.run == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "vite did not come up" && exit 1
      - name: Run E2E (functional suite)
        if: steps.guard.outputs.run == 'true'
        run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
