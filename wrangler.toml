name = "manim"
main = "worker/index.js"
compatibility_date = "2024-09-23"
# nodejs_compat lets livekit-server-sdk (jose / crypto) run on the Workers runtime.
compatibility_flags = ["nodejs_compat"]

# Workers + Static Assets: serve the Vite build and route /api/* through the
# Worker. run_worker_first = true so the Worker handles API routes before the
# SPA fallback; everything else is served from the assets (index.html for
# unknown client routes like /r/:room).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Runtime plain-text vars. These MUST live here (not just the dashboard): a
# `wrangler deploy` treats wrangler.toml as the source of truth and drops any
# dashboard-only plain-text vars. VITE_LIVEKIT_URL is public (it ships in the
# browser bundle too), so committing it is fine.
# SECRETS (LIVEKIT_API_KEY, LIVEKIT_API_SECRET, RESEND_API_KEY) are NOT here —
# set them as encrypted Secrets in the dashboard / `wrangler secret put`; those
# survive deploys and never get committed.
[vars]
VITE_LIVEKIT_URL = "wss://manim-2dl88wbx.livekit.cloud"
RESEND_FROM = "Manim <onboarding@resend.dev>"
# Server-side Supabase — token verification for the beta gate (verifySupabaseUser)
# and the push RPC. MUST live here, not only in the dashboard: a deploy rewrites the
# Worker's plaintext vars from this file and wipes any set elsewhere (that's why these
# vanished after a deploy). The URL is public. SUPABASE_ANON_KEY is set as a Worker
# SECRET (secrets survive deploys), so it's intentionally NOT listed here.
SUPABASE_URL = "https://xrbvjcxefdihkojxebur.supabase.co"
# The anon/public key — designed for client exposure (already shipped in the bundle
# as VITE_SUPABASE_ANON_KEY), so committing it here is safe. Pinned so deploys can't
# wipe it (a plaintext dashboard var gets erased on every deploy; that's why it kept
# vanishing). RLS — not key secrecy — protects the data.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyYnZqY3hlZmRpaGtvanhlYnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NTI5OTYsImV4cCI6MjA5NzAyODk5Nn0.CZaXYizzM_kZmhKpfpIQAUbbaReoT0DIus7nnx2DmWs"
# Web Push (background incoming-call notifications). Public key + subject pinned here
# so a deploy doesn't wipe them (same reason as SUPABASE_URL above); VAPID_PRIVATE_KEY
# is a Worker Secret. This SAME public key must also be the VITE_VAPID_PUBLIC_KEY build
# var so the client subscribes with the matching key. Push stays a graceful no-op
# until VAPID_PRIVATE_KEY is set AND the push_subscriptions table + get_push_targets
# RPC exist (DEPLOY.md §4c).
VAPID_PUBLIC_KEY = "BADDBgiHH8moL6Wc4Re005pxPOulTr9lNuQvFTTqHpvl_C4NuYRM5Qs-a61ROhJQrDpBNbKyxDRnYpgA72B21eI"
VAPID_SUBJECT = "mailto:bismark.gyau@amalitech.com"
# Beta allowlist gate (server/core.mjs). When "true", only accounts whose login
# email has an `allow:<email>` key in ROOM_KV may START a room; their invited guests
# join via the link without being listed. Seed the allowlist BEFORE flipping this on,
# or every host (you included) gets locked out. Room size is capped at ROOM_CAP
# (default 10) and links carry LINK_EPOCH (default "1"); set those only to override.
BETA_GATE = "true"

# Native Workers rate limiter (no external store) guarding the unauthenticated
# email-invite endpoint against spam/abuse: 5 requests per 60s per client IP.
# `period` must be 10 or 60. The Worker degrades gracefully if the binding is
# absent (e.g. local dev), so this only takes effect in production.
[[unsafe.bindings]]
name = "EMAIL_RATELIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Per-IP rate limit on the unauthenticated knock (join) endpoint. A legitimate
# user knocks a handful of times; a room-code enumeration scan knocks thousands.
# 20/60s per IP leaves real retries (waiting-room repolls, reconnects) untouched
# while making a brute-force sweep of the code space impractical. `period` must
# be 10 or 60. The Worker degrades gracefully if the binding is absent.
[[unsafe.bindings]]
name = "KNOCK_RATELIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Durable room-lifecycle store for invite-link expiry (server/core.mjs roomKv). A
# link-shared room is stamped on join and retired after 30 days of no joins, so a
# stale link can't silently recreate a fresh room under the same slug. The Worker
# degrades to a no-op when this binding is absent (so the code is safe to ship before
# you provision it), but expiry is NOT enforced until it's bound.
#
[[kv_namespaces]]
binding = "ROOM_KV"
id = "aa044ac9f8024ef786813cb7995a1d2d"
preview_id = "32f20a00b86d4eebadce9c0090ee8711"
