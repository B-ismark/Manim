name = "manim"
main = "worker/index.js"
compatibility_date = "2024-09-23"
# nodejs_compat lets livekit-server-sdk (jose / crypto) run on the Workers runtime.
compatibility_flags = ["nodejs_compat"]

# Workers + Static Assets: serve the Vite build and route /api/* through the
# Worker. run_worker_first = true so the Worker handles API routes before the
# SPA fallback; everything else is served from the assets (index.html for
# unknown client routes like /r/:room).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Runtime plain-text vars. These MUST live here (not just the dashboard): a
# `wrangler deploy` treats wrangler.toml as the source of truth and drops any
# dashboard-only plain-text vars. VITE_LIVEKIT_URL is public (it ships in the
# browser bundle too), so committing it is fine.
# SECRETS (LIVEKIT_API_KEY, LIVEKIT_API_SECRET, RESEND_API_KEY) are NOT here —
# set them as encrypted Secrets in the dashboard / `wrangler secret put`; those
# survive deploys and never get committed.
[vars]
VITE_LIVEKIT_URL = "wss://manim-2dl88wbx.livekit.cloud"
RESEND_FROM = "Manim <onboarding@resend.dev>"

# Native Workers rate limiter (no external store) guarding the unauthenticated
# email-invite endpoint against spam/abuse: 5 requests per 60s per client IP.
# `period` must be 10 or 60. The Worker degrades gracefully if the binding is
# absent (e.g. local dev), so this only takes effect in production.
[[unsafe.bindings]]
name = "EMAIL_RATELIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
